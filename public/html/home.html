<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==================================================
         CONFIGURAÇÕES BÁSICAS DO DOCUMENTO
         ================================================== -->

    <!-- Define a codificação de caracteres utilizada pela página.
         UTF-8 permite utilizar acentos, caracteres especiais etc. -->
    <meta charset="UTF-8">

    <!-- Faz a página se adaptar à largura da tela do dispositivo.
         É fundamental para responsividade em celulares e tablets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece na aba do navegador. -->
    <title>Home</title>


    <!-- ==================================================
         BIBLIOTECAS EXTERNAS
         ================================================== -->

    <!--
        Font Awesome

        Biblioteca utilizada para disponibilizar ícones.
        No projeto, ela é utilizada principalmente nos botões
        da barra lateral e no botão de pesquisa.

        Exemplo:
        fa-gear              -> ícone de configurações
        fa-user-tie           -> ícone de perfil
        fa-magnifying-glass   -> ícone de pesquisa
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <!--
        Bootstrap 5.3.3

        Framework CSS utilizado para facilitar a criação
        de interfaces responsivas.

        Neste arquivo, algumas classes do Bootstrap são utilizadas,
        como:

        container-fluid -> cria um container que ocupa toda a largura.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">


    <!-- ==================================================
         CSS DO PROJETO
         ================================================== -->

    <!--
        CSS principal da página Home.

        Responsável principalmente pela estrutura e aparência
        dos elementos da página inicial.
    -->
    <link rel="stylesheet" href="../styleCSS/home.css">


    <!--
        CSS responsável pelo menu/configurações.
    -->
    <link rel="stylesheet" href="../styleCSS/menuConfig.css">


    <!--
        CSS responsável pela janela/modal do perfil.
    -->
    <link rel="stylesheet" href="../styleCSS/windowProfile.css">


    <!--
        CSS responsável pela expansão dos cards de filmes.
    -->
    <link rel="stylesheet" href="../styleCSS/expandCards.css">

</head>


<body>

    <!-- ==================================================
         CONTAINER GLOBAL
         ================================================== -->

    <!--
        Container principal de toda a página.

        container-fluid:
        Classe do Bootstrap que faz o elemento ocupar
        toda a largura disponível da tela.

        id="Global":
        Permite selecionar esse elemento através do CSS ou JavaScript.
    -->
    <div id="Global" class="container-fluid">


        <!-- ==================================================
             BARRA LATERAL
             ================================================== -->

        <!--
            Barra lateral da aplicação.

            Ela contém os principais botões de navegação/configuração
            da interface.
        -->
        <div id="side-Bar" class="container-fluid">


            <!--
                Container que agrupa os botões existentes
                na barra lateral.
            -->
            <div id="options-sidebar">


                <!-- ==================================================
                     BOTÃO DE CONFIGURAÇÕES
                     ================================================== -->

                <!--
                    Botão responsável por abrir a janela de configurações.

                    id="openSettings":
                    É utilizado pelo JavaScript para identificar
                    esse botão e adicionar o comportamento de abertura
                    da janela de configurações.

                    type="button":
                    Define que o botão não possui comportamento
                    de envio de formulário.
                -->
                <button class="button-sideBar" id="openSettings" type="button">

                    <!--
                        Ícone de engrenagem fornecido pelo Font Awesome.

                        fa-solid:
                        Define o estilo sólido do ícone.

                        fa-gear:
                        Define o ícone de engrenagem.
                    -->
                    <i class="fa-solid fa-gear"></i>

                </button>


                <!-- ==================================================
                     BOTÃO DE PERFIL
                     ================================================== -->

                <!--
                    Botão responsável por abrir a janela de perfil
                    do usuário.

                    id="openProfile":
                    É utilizado pelo JavaScript para localizar
                    esse botão.
                -->
                <button class="button-sideBar" id="openProfile" type="button">

                    <!-- Ícone de usuário do Font Awesome. -->
                    <i class="fa-solid fa-user-tie"></i>

                </button>

            </div>

        </div>

             CONTEÚDO PRINCIPAL
             ================================================== -->

            Container que contém todo o conteúdo principal da Home.

            Dentro dele estão:

            - Cards de filmes
            - Recomendações
            - Rodapé
        -->

            <!-- ==================================================
                 CABEÇALHO
                 ================================================== -->

            <div id="header">

                <!--
                    Cabeçalho da página.

                    A classe "headers" pode ser utilizada para
                    compartilhar estilos com outros títulos da página.

                    O id "TextHeader" permite aplicar estilos
                    ou manipulações específicas através de CSS/JS.
                -->
                <header id="TextHeader" class="headers">

                    Welcome to the Home Page

                </header>

            </div>


            <!-- ==================================================
                 BARRA DE PESQUISA
                 ================================================== -->

            <div id="Search-bar">

                <!--
                    Campo onde o usuário digita o nome do filme
                    que deseja pesquisar.

                    type="text":
                    Define que o campo recebe texto.

                    placeholder:
                    Texto exibido enquanto o usuário ainda não
                    digitou nada.

                    class="inputs":
                    Classe utilizada pelo CSS para estilizar
                    o campo de entrada.
                -->
                <input type="text" placeholder="Search..." class="inputs">


                <!--
                    Botão utilizado para executar a pesquisa.

                    A funcionalidade real desse botão poderá ser
                    implementada posteriormente através de JavaScript.
                -->
                <button class="search-button">

                    <!-- Ícone de lupa do Font Awesome. -->
                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>

            </div>

            <!-- ==================================================

                <!-- ==================================================

                <div id="header-recommendation">

                    <!--

                </div>


                <!-- ==================================================

                <!--

                    A ideia é que os filmes dessa seção sejam

                    Por exemplo:

                    Usuário pesquisa/avalia filmes

            <footer id="footer">

                <p>

                    <!--
                        &copy; representa o símbolo de copyright ©.

                        O rodapé informa o ano e os direitos

                    -->
                    &copy; 2026 Your Company. All rights reserved.


                    <!--
                        Link para o repositório do projeto no GitHub.

                        target="_blank":

                        target="_blank".
                    -->
                    <a class="knowMore-ancora" href="https://github.com/joaohpr/Trabalho_Final" target="_blank"

    <!-- ==================================================

         ================================================== -->

    <!--
        Container vazio utilizado pelo JavaScript.

        A ideia é carregar dinamicamente o conteúdo
        das janelas/modais dentro desse elemento.

        Por exemplo:

        #modal-window
             ↓
        janela de configurações

        ou

        #modal-window
             ↓
        janela de perfil

        O conteúdo pode ser inserido utilizando JavaScript/jQuery.
