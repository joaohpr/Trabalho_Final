<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Filme</title>

    <link rel="stylesheet" href="../styleCSS/expandCards.css">
</head>

<body>

    <main id="container-global">

        <section class="movie-card">

            <header class="x-bar">

                <button class="close-btn" type="button" id="closeButton">
                    ✕
                </button>

                <h1 class="headerText">
                    Nome do Filme
                </h1>

            </header>

            <div class="content">

                <div class="poster">

                    <img
                        class="posterImg"
                        src="../img/CineSearch.png"
                        alt="Poster do Filme">

                </div>

                <article class="details">

                    <h2 class="headerText">
                        Detalhes do filme
                    </h2>

                    <p class="textDetails">

                        Aqui serão exibidas informações como sinopse,
                        gênero, duração, avaliação, data de lançamento,
                        elenco e outras informações vindas da API.

                    </p>

                </article>

            </div>

        </section>

    </main>

</body>

</html>
