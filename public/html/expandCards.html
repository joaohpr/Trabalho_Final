<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Filme</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../styleCSS/expandCards.css">
</head>

<body>

    <main id="container-global" class="d-flex align-items-center justify-content-center">

        <section class="movie-card card p-3">

            <header class="x-bar d-flex align-items-center justify-content-between mb-3">

                <h1 class="headerText mb-0">
                    Nome do Filme
                </h1>

                <button class="close-btn btn-close" type="button" id="closeButton" aria-label="Fechar"></button>

            </header>

            <div class="content row g-3">

                <div class="poster col-md-4">

                    <img
                        class="posterImg img-fluid rounded"
                        src="../img/CineSearch.png"
                        alt="Poster do Filme">

                </div>

                <article class="details col-md-8">

                    <h2 class="headerText">
                        Detalhes do filme
                    </h2>

                    <p class="textDetails">

                        Aqui serão exibidas informações como sinopse,
                        gênero, duração, avaliação, data de lançamento,
                        elenco e outras informações vindas da API.

                    </p>

                </article>

            </div>

        </section>

    </main>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
