<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styleCSS/menuConfig.css">


    <title>Settings-CineSearch</title>
</head>

<body>

    <!-- ========================= -->
    <!-- container global -->
    <!-- ========================= -->

    <div id="continerGlobal">

        <!-- ========================= -->
        <!-- barra superior -->
        <!-- ========================= -->

        <header id="barraVertical">

            <div id="CineSearch">
                CineSearch
            </div>

        </header>

        <!-- ========================= -->
        <!-- conteudo principal -->
        <!-- ========================= -->

        <main id="containerConteudo">

            <!-- ========================= -->
            <!-- card settings -->
            <!-- ========================= -->

            <section id="Settings">

                <button id="buttonClose">X</button>

                <form id="formSettings">

                    <!-- titulo -->

                    <h1 id="textSettings">
                        Settings
                    </h1>

                    <!-- dark mode -->

                    <div class="divInput">

                        <label for="toggleDarkMode" class="labelInput">
                            Dark Mode
                        </label>

                        <label class="switch">
                            <input type="checkbox" id="toggleDarkMode" checked>
                            <span class="slider"></span>
                        </label>

                    </div>

                    <!-- autoplay trailers -->

                    <div class="divInput">

                        <label for="toggleAutoplay" class="labelInput">
                            Autoplay Trailers
                        </label>

                        <label class="switch">
                            <input type="checkbox" id="toggleAutoplay" checked>
                            <span class="slider"></span>
                        </label>

                    </div>

                    <!-- adult content filter -->

                    <div class="divInput">

                        <label for="toggleAdultFilter" class="labelInput">
                            Adult Content Filter
                        </label>

                        <label class="switch">
                            <input type="checkbox" id="toggleAdultFilter" checked>
                            <span class="slider"></span>
                        </label>

                    </div>

                    <!-- genero preferido -->

                    <div class="divInput">

                        <label for="selectGenre" class="labelInput">
                            Preferred Genre
                        </label>

                        <select id="selectGenre" class="inputs">
                            <option value="all" selected>All</option>
                            <option value="action">Action</option>
                            <option value="comedy">Comedy</option>
                            <option value="drama">Drama</option>
                            <option value="horror">Horror</option>
                            <option value="sci-fi">Sci-Fi</option>
                            <option value="romance">Romance</option>
                            <option value="documentary">Documentary</option>
                        </select>

                    </div>

                    <!-- language -->

                    <div class="divInput">

                        <label for="selectLanguage" class="labelInput">
                            Language
                        </label>

                        <select id="selectLanguage" class="inputs">
                            <option value="pt-br">Portuguese</option>
                            <option value="en">English</option>
                            <option value="es">Spanish</option>
                        </select>

                    </div>

                    <!-- buttons -->

                    <div id="buttonsRow">

                        <button type="submit" id="buttonSave">
                            Save
                        </button>

                        <button type="button" id="buttonCancel">
                            Cancel
                        </button>

                    </div>

                    <!-- voltar -->

                    <p id="backHome">

                        <a href="/public/html/home.html" id="ancoraBackHome">
                            Back to Home
                        </a>

                    </p>

                </form>

            </section>

        </main>

        <footer id="rodape">

            <p id="textRodape">

                &copy; 2026 Your Company. All rights reserved.<a class="knowMore-ancora"
                    href="https://github.com/joaohpr/Trabalho_Final" target="_blank">
                    Know More
                </a>
            </p>
        </footer>
    </div>

</body>

<script src="../javaScript/jquery-4.0.0.min.js"></script>
<script src="../javaScript/menuConfig.js"></script>

</html>
