<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configurações</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../styleCSS/menuConfig.css">

</head>

<body>

    <div id="cfg-container" class="container p-4">

        <div id="cfg-header" class="d-flex align-items-center justify-content-between mb-4">

            <header class="cfg-title-text" id="cfg-title">
                Settings
            </header>

            <button id="cfg-close-btn" class="cfg-btn btn-close" type="button" aria-label="Fechar"></button>

        </div>

        <div id="cfg-preferences" class="cfg-section mb-4">

            <div class="cfg-row-header d-flex align-items-center gap-2 mb-3">

                <img src="" alt="icone" class="cfg-icon">

                <header class="cfg-title-text">
                    Preferências de conteúdo
                </header>

            </div>

            <div class="cfg-row mb-2">

                <h2 class="cfg-subtitle">
                    Gêneros favoritos
                </h2>

            </div>

            <div class="cfg-row d-flex flex-wrap gap-2" id="cfg-genres-row"></div>

        </div>

        <div id="cfg-recommendation" class="cfg-section mb-4">

            <div class="cfg-row-header d-flex align-items-center gap-2 mb-3">

                <img src="" alt="icone" class="cfg-icon">

                <h2 class="cfg-title-text">
                    Motor de Recomendação
                </h2>

            </div>

            <div class="cfg-row mb-3">

                <header class="cfg-subtitle">
                    Basear recomendações nos:
                </header>

                <div id="cfg-options-block" class="d-flex flex-column gap-2">

                    <div class="cfg-toggle-row form-check form-switch d-flex align-items-center justify-content-between">

                        <span class="cfg-toggle-label">
                            Meus streamings
                        </span>

                        <input type="checkbox" role="switch" id="cfg-switch-streamings" class="cfg-switch-input form-check-input" value="myStreamings">

                        <label for="cfg-switch-streamings" class="cfg-toggle-slider"></label>

                    </div>

                    <div class="cfg-toggle-row form-check form-switch d-flex align-items-center justify-content-between">

                        <span class="cfg-toggle-label">
                            Pesquisas
                        </span>

                        <input type="checkbox" role="switch" id="cfg-switch-search" class="cfg-switch-input form-check-input" value="pesquisas">

                        <label for="cfg-switch-search" class="cfg-toggle-slider"></label>

                    </div>

                </div>

            </div>

            <div class="cfg-row">

                <h2 class="cfg-subtitle">
                    Seus Streamings
                </h2>

                <div id="cfg-streaming-row" class="row row-cols-2 row-cols-md-3 g-3">

                    <div class="col">
                        <div class="cfg-card card text-center h-100 p-2">
                            <img src="../img/imgStreaming/hboMax.png" alt="HBOMAX" value="HBOMAX" class="cfg-card-icon">
                            <header class="cfg-card-title">HBOMAX</header>
                        </div>
                    </div>

                    <div class="col">
                        <div class="cfg-card card text-center h-100 p-2">
                            <img src="../img/imgStreaming/netflix.png" alt="NETFLIX" value="NETFLIX" class="cfg-card-icon">
                            <header class="cfg-card-title">NETFLIX</header>
                        </div>
                    </div>

                    <div class="col">
                        <div class="cfg-card card text-center h-100 p-2">
                            <img src="../img/imgStreaming/primeVideo.png" alt="AMAZON PRIME" value="AMAZONPRIME" class="cfg-card-icon">
                            <header class="cfg-card-title">AMAZON PRIME</header>
                        </div>
                    </div>

                    <div class="col">
                        <div class="cfg-card card text-center h-100 p-2">
                            <img src="../img/imgStreaming/disneyPlus.png" alt="DISNEY PLUS" value="DISNEYPLUS" class="cfg-card-icon">
                            <header class="cfg-card-title">DISNEY PLUS</header>
                        </div>
                    </div>

                    <div class="col">
                        <div class="cfg-card card text-center h-100 p-2">
                            <img src="../img/imgStreaming/appleTv.png" alt="APPLETV" value="APPLETV" class="cfg-card-icon">
                            <header class="cfg-card-title">APPLETV</header>
                        </div>
                    </div>

                    <div class="col">
                        <div class="cfg-card card text-center h-100 p-2">
                            <img src="../img/imgStreaming/crunchyroll.png" alt="CRUNCHYROLL" value="CRUNCHYROLL" class="cfg-card-icon">
                            <header class="cfg-card-title">CRUNCHYROLL</header>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
<script src="../javaScript/lib/jquery-4.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
