<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="stylesheet" href="../styleCSS/menuConfig.css">

</head>


<body>

    <div id="container-Global">


        <div id="header">

            <button id="close-Settings" class="buttons">X</button>

            <header class="header-text" id="text-settings">Settings</header>

        </div>


        <div id="container-preferencias" class="containers">


            <div class="row-header">

                <img src="" alt="icone" class="icons">

                <header class="header-text">Preferências de conteúdo</header>

            </div>


            <div class="rows">

                <h2 class="subTitle">Gêneros favoritos</h2>

                <div id=""></div>

            </div>


            <div class="rows" id="row-generos"></div>


        </div>


        <div id="container-recomendacoes" class="containers">


            <div class="row-header">

                <img src="" alt="icone" class="icons">

                <h2 class="header-text">Motor de Recomendação</h2>

            </div>


            <div class="rows">

                <header class="subTitle">Basear recomendações nos:</header>


                <div id="block-options">

                    <div class="toggle-row">
                        <span class="toggle-label-text">Meus streamings</span>
                        <input type="checkbox" id="switch-myStreamings" class="switch" value="myStreamings">
                        <label for="switch-myStreamings" class="toggle"></label>
                    </div>

                    <div class="toggle-row">
                        <span class="toggle-label-text">Pesquisas</span>
                        <input type="checkbox" id="switch-pesquisas" class="switch" value="pesquisas">
                        <label for="switch-pesquisas" class="toggle"></label>
                    </div>

                </div>

            </div>


            <div class="rows">


                <h2 class="subTitle">
                    Seus Streamings
                </h2>


                <div id="rowCards">


                    <div class="cards">

                        <img src="../img/imgStreaming/hboMax.png" alt="HBOMAX" value="HBOMAX" class="icons-streaming">

                        <header class="header-cards">
                            HBOMAX
                        </header>

                    </div>


                    <div class="cards">

                        <img src="../img/imgStreaming/netflix.png" alt="NETFLIX" value="NETFLIX"
                            class="icons-streaming">

                        <header class="header-cards">
                            NETFLIX
                        </header>

                    </div>


                    <div class="cards">

                        <img src="../img/imgStreaming/primeVideo.png" alt="AMAZON PRIME" value="AMAZONPRIME"
                            class="icons-streaming">

                        <header class="header-cards">
                            AMAZON PRIME
                        </header>

                    </div>


                    <div class="cards">

                        <img src="../img/imgStreaming/disneyPlus.png" alt="DISNEY PLUS" value="DISNEYPLUS"
                            class="icons-streaming">

                        <header class="header-cards">
                            DISNEY PLUS
                        </header>

                    </div>


                    <div class="cards">

                        <img src="../img/imgStreaming/appleTv.png" alt="APPLETV" value="APPLETV"
                            class="icons-streaming">

                        <header class="header-cards">
                            APPLETV
                        </header>

                    </div>


                    <div class="cards">

                        <img src="../img/imgStreaming/crunchyroll.png" alt="CRUNCHYROLL" value="CRUNCHYROLL"
                            class="icons-streaming">

                        <header class="header-cards">
                            CRUNCHYROLL
                        </header>

                    </div>


                </div>


            </div>


        </div>


    </div>


</body>

</html>
