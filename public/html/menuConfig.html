>

</div>

<script>
    const genres = ["Ação", "Comédia", "Drama", "Ficção científica", "Terror", "Romance", "Suspense", "Animação"];

    // gêneros que já começam selecionados
    let selectedGenres = ["Ficção científica", "Drama"];

    function renderGenres() {
        const container = document.getElementById("row-generos"); // usando seu id
        container.innerHTML = ""; // limpa antes de redesenhar

        genres.forEach(genre => {
            const chip = document.createElement("button");
            chip.textContent = genre;
            chip.className = "genre-chip";

            // se o gênero estiver na lista de selecionados, marca visualmente
            if (selectedGenres.includes(genre)) {
                chip.classList.add("active");
            }

            // ao clicar, alterna a seleção
            chip.addEventListener("click", () => toggleGenre(genre));

            container.appendChild(chip);
        });
    }

    function toggleGenre(genre) {
        if (selectedGenres.includes(genre)) {
            // já estava selecionado -> remove
            selectedGenres = selectedGenres.filter(g => g !== genre);
        } else {
            // não estava -> adiciona
            selectedGenres.push(genre);
        }

        renderGenres(); // redesenha os botões com o novo estado
        console.log("Selecionados:", selectedGenres);
    }

    renderGenres(); // chamada inicial
</script>
