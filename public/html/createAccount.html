<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styleCSS/createAccount.css">
    <title>Create Account</title>
</head>

<body>

    <div id="global-container">

        <div id="container">

            <header id="textHeader">
                Create Account
            </header>

            <div id="input-container">

                <div class="row-input">

                    <div class="box-input">

                        <label for="username" class="label-input">
                            Username
                        </label>

                        <input type="text" id="username" class="inputs" placeholder="Username" required>

                    </div>

                    <div class="box-input">

                        <label for="email" class="label-input">
                            Email
                        </label>

                        <input type="email" id="email" name="email" class="inputs" placeholder="Email" required>

                    </div>

                </div>

                <div class="row-input">

                    <div class="box-input">

                        <label for="password" class="label-input">
                            Password
                        </label>

                        <input type="password" id="password" name="password" class="inputs" placeholder="Password"
                            required>

                    </div>

                    <div class="box-input">

                        <label for="confirm-password" class="label-input">
                            Confirm Password
                        </label>

                        <input type="password" id="confirm-password" name="confirm-password" class="inputs"
                            placeholder="Confirm Password" required>

                    </div>

                </div>

                <div class="row-btn">

                    <button type="submit" class="buttons">
                        Create Account
                    </button>

                </div>

            </div>

        </div>

        <footer id="rodape">

            <p id="textRodape">

                &copy; 2026 Your Company. All rights reserved.

                <a class="knowMore-ancora" href="https://github.com/joaohpr/Trabalho_Final" target="_blank"
                    rel="noopener noreferrer">

                    Know More

                </a>

            </p>

        </footer>

    </div>

</body>
<script src="../javaScript/lib/jquery-4.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
