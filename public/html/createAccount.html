<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styleCSS/createAccount.css">
    <title>Create Account</title>
</head>

<body>
    <div id="container">
        <div id="CreateAccount">
            <form action="">
                <h1 id="textCreateAccount">Create Your Account</h1>

                <div class="rowInputs">
                    <div class="divInput">
                        <label for="nameInput" class="label">Name</label>
                        <input type="text" class="inputs" id="nameInput">
                    </div>

                    <div class="divInput">
                        <label for="emailInput" class="label">Your Email</label>
                        <input type="email" class="inputs" id="emailInput">
                    </div>
                </div>

                <div class="rowInputs">
                    <div class="divInput">
                        <label for="passwordInput" class="label">Password</label>
                        <input type="password" class="inputs" id="passwordInput">
                    </div>

                    <div class="divInput">
                        <label for="confirmPassword" class="label">Confirm your password</label>
                        <input type="password" class="inputs" id="confirmPassword">
                    </div>
                </div>

                <div class="buttonContainer">
                    <button type="submit" id="buttonCreate">Create</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
