<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../styleCSS/windowMenu.css">
</head>

<body>

    <div class="container-fluid" id="container-main">

        <div class="settings-window">

            <div class="settings-header">

                <div class="text-header">
                    Settings
                </div>

                <button class="btn btn-danger" id="backButton">
                    X
                </button>

            </div>


            <fieldset id="container-recomendations" class="container-fluid">

                <div class="settings-option">

                    <div class="text-subtitle">
                        Pesquisas
                    </div>

                    <label class="toggle-switch">

                        <input type="checkbox" id="searchToggle">

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="settings-option">

                    <div class="text-subtitle">
                        Meus Streamings
                    </div>

                    <label class="toggle-switch">

                        <input type="checkbox" id="streamingToggle">

                        <span class="slider"></span>

                    </label>

                </div>

            </fieldset>


            <div class="cfg-row">

                <div class="cfg-subtitle">
                    Seus Streamings
                </div>


                <div id="cfg-streaming-row">


                    <div class="cfg-card">

                        <img src="../img/imgStreaming/hboMax.png" alt="HBOMAX" value="HBOMAX" class="cfg-card-icon">

                        <div class="cfg-card-title">
                            HBOMAX
                        </div>

                    </div>


                    <div class="cfg-card">

                        <img src="../img/imgStreaming/netflix.png" alt="NETFLIX" value="NETFLIX" class="cfg-card-icon">

                        <div class="cfg-card-title">
                            NETFLIX
                        </div>

                    </div>


                    <div class="cfg-card">

                        <img src="../img/imgStreaming/primeVideo.png" alt="AMAZON PRIME" value="AMAZONPRIME"
                            class="cfg-card-icon">

                        <div class="cfg-card-title">
                            AMAZON PRIME
                        </div>

                    </div>


                    <div class="cfg-card">

                        <img src="../img/imgStreaming/disneyPlus.png" alt="DISNEY PLUS" value="DISNEYPLUS"
                            class="cfg-card-icon">

                        <div class="cfg-card-title">
                            DISNEY PLUS
                        </div>

                    </div>


                    <div class="cfg-card">

                        <img src="../img/imgStreaming/appleTv.png" alt="APPLETV" value="APPLETV" class="cfg-card-icon">

                        <div class="cfg-card-title">
                            APPLETV
                        </div>

                    </div>


                    <div class="cfg-card">

                        <img src="../img/imgStreaming/crunchyroll.png" alt="CRUNCHYROLL" value="CRUNCHYROLL"
                            class="cfg-card-icon">

                        <div class="cfg-card-title">
                            CRUNCHYROLL
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
