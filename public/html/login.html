<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleCSS/login.css">
    <title>Login</title>
</head>
<body>
    <div id="container">
        <div id="Login">
            <h1 id="textLogin">Login</h1>

            <div class="divInput">
                <label for="name" class="labelInput">Name</label>
                <input type="text" id="name" class="inputs">
            </div>

            <div class="divInput">
                <label for="password" class="labelInput">Password</label>
                <input type="password" id="password" class="inputs">
            </div>
            
            <div class="divInput">
                    <button type="submit" class="inputs" id="buttonLogin">Login</button>
            </div>

            <div>
                <p id="createAccount">
                    Don't have an account ? 
                    <br>
                    <a id= ""  href="createAccount.html">Create Your Account</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
