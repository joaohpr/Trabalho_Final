<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styleCSS/login.css">
    <title>Login - CineSearch</title>
</head>

<body>

    <!-- ========================= -->
    <!-- CONTAINER GLOBAL -->
    <!-- ========================= -->

    <div id="continerGlobal">

        <!-- ========================= -->
        <!-- HEADER -->
        <!-- ========================= -->

        <header id="barraVertical">

            <div id="CineSearch">
                CineSearch
            </div>

        </header>

        <!-- ========================= -->
        <!-- CONTEÚDO PRINCIPAL -->
        <!-- ========================= -->

        <main id="containerConteudo">

            <!-- ========================= -->
            <!-- CARD LOGIN -->
            <!-- ========================= -->

            <section id="Login">

                <form id="formLogin">

                    <!-- TÍTULO -->

                    <h1 id="textLogin">
                        Login
                    </h1>

                    <!-- GRUPO DE INPUTS -->

                    <fieldset id="grupoInputs">

                        <!-- USERNAME -->

                        <div class="divInput">

                            <label for="inputUsername" class="labelInput">
                                Username
                            </label>

                            <input
                                type="text"
                                id="inputUsername"
                                class="inputs"
                                placeholder="Username"
                                autocomplete="username"
                                required>

                        </div>

                        <!-- PASSWORD -->

                        <div class="divInput">

                            <label for="inputPassword" class="labelInput">
                                Password
                            </label>

                            <input
                                type="password"
                                id="inputPassword"
                                class="inputs"
                                placeholder="Password"
                                autocomplete="current-password"
                                required>

                        </div>

                    </fieldset>

                    <!-- BOTÃO -->

                    <button type="submit" id="buttonLogin">
                        Entrar
                    </button>

                    <!-- CRIAR CONTA -->

                    <p id="createAccount">

                        Don't have an account?

                        <a href="createAccount.html" id="ancoraCreateAccount">
                            Create your Account
                        </a>

                    </p>

                </form>

            </section>

        </main>

        <!-- ========================= -->
        <!-- RODAPÉ -->
        <!-- ========================= -->

        <footer id="rodape">

            <p id="textRodape">
                &copy; 2024 CineSearch. All rights reserved.
            </p>

        </footer>

    </div>

</body>

</html>
